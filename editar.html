<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alejandro Guadalupe">
    <title>Agregar</title>
    <meta name="description" content="Carrito de coches seleccionados.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

<script src="js/navbar.js"></script>
<script src="js/editar.js"></script>

<div id="navbar"></div>

<h1>editar coche</h1>

    <form id="agregar_coche">

    <label for="modelo">Modelo</label>
    <br>
    <input type="text" id="modelo" placeholder="Introduzca el modelo">
    <br>

    <label for="precio">Precio</label>
    <br>
    <input type="number" id="precio" placeholder="Introduzca el precio">
    <br>

    <label for="km">Kilómetros</label>
    <br>
    <input type="number" id="km" placeholder="Introduzca los kilómetros">
    <br>

    <label for="descripcion">Descripción</label>
    <br>
    <textarea id="descripcion" placeholder="Introduzca una descripción"></textarea>
    <br>

    <label for="categoria">Categoría</label>
    <br>
    <input type="text" id="categoria" placeholder="Introduzca la categoría">
    <br>

    <label for="imagen">Imagen (URL)</label>
    <br>
    <input type="url" id="imagen" placeholder="Introduzca la URL de la imagen">
    <br>

    <button type="button" onclick="editar_coche(modelo.value, precio.value, km.value, descripcion.value, categoria.value, imagen.value)">editar_coche</button>

</form>

</body>
</html>
